<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Waiting</title>
  <style>body { font-family: sans-serif; margin: 20px; }</style>
</head>
<body>
  <h1>Search results</h1>
  <p><button id="load">Load results</button></p>
  <div id="status"></div>
  <ul id="results"></ul>
  <p><a id="slow" href="/slow?ms=2500">Open the slow report</a></p>
  <p><a id="export" href="/export.csv">Export prices</a></p>
  <iframe id="frame" title="Late frame" srcdoc="<p id='late'></p><script>setTimeout(() => { document.getElementById('late').textContent = 'Frame finished'; }, 900);</script>"></iframe>
  <script>
    document.getElementById('load').addEventListener('click', () => {
      document.getElementById('status').innerHTML = '<span class="spinner">Loading…</span>';
      setTimeout(() => {
        document.getElementById('status').textContent = 'Results ready';
        document.getElementById('results').innerHTML = '<li class="hit">Blue kettle</li><li class="hit">Red kettle</li>';
      }, 1200);
    });
  </script>
</body>
</html>
