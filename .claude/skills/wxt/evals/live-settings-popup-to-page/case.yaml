schema_version: "1.1"
name: live-settings-popup-to-page
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Settings are stored with WXT storage (typed defineItem with fallback, storage permission), the popup edits them with React, the content script reads them and reacts live through a storage watcher (no page reload), cleanup uses the content script ctx, the answer presents the communication options (storage watch vs messaging) with a clear recommendation and reason, and the project builds.
