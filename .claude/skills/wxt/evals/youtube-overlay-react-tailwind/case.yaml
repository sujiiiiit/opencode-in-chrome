schema_version: "1.1"
name: youtube-overlay-react-tailwind
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The project gets a content script for YouTube that mounts a React + Tailwind UI isolated from the page (shadow root with cssInjectionMode ui, CSS imported in the entry, Tailwind v4 wired via the Vite plugin), handles YouTube's client-side navigation including the initial page, saves videos with typed WXT storage and the storage permission, avoids stale WXT APIs, and the project builds.
